name: Cleanup guest players

# Guest players (players.is_guest = true) are host-registered stand-ins for
# people who didn't join via the invite link. They're temporary: this job
# periodically calls the backend's internal cleanup endpoint to delete any
# guest not seen in RETENTION_DAYS so they don't accumulate in Supabase.
# Guests are matched case-insensitively by name when re-registered, and
# re-registering refreshes players.updated_at, so a guest who keeps coming
# back is never treated as stale.
#
# The endpoint (POST /internal/cleanup-guests) does the deletion itself —
# this workflow has no direct database access and doesn't run any SQL.
#
# Required repo secrets:
#   API_BASE_URL     — the backend's base URL, e.g. https://api.example.com
#   CRON_API_SECRET  — must match the backend's CRON_API_SECRET env var
# Set these under Settings > Secrets and variables > Actions.

on:
  schedule:
    - cron: '0 11 * * 5' # every friday, 18:00 UTC
  workflow_dispatch:
    inputs:
      retention_days:
        description: 'Delete guests not seen in this many days'
        required: false
        default: '30'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Call guest cleanup endpoint
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          CRON_API_SECRET: ${{ secrets.CRON_API_SECRET }}
          RETENTION_DAYS: ${{ inputs.retention_days || '30' }}
        run: |
          set -euo pipefail
          response="$(curl -sS -w '\n%{http_code}' \
            -X POST "$API_BASE_URL/internal/cleanup-guests" \
            -H "X-Cron-Secret: $CRON_API_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"retention_days\": $RETENTION_DAYS}")"
          body="$(echo "$response" | head -n -1)"
          status="$(echo "$response" | tail -n1)"
          echo "$body"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "cleanup endpoint returned HTTP $status" >&2
            exit 1
          fi
